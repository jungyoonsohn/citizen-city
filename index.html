<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시민 참여형 도시 설계</title>
  <style>
    body { margin: 0; }
    canvas { display: block; }

    button, select {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      z-index: 10;
    }

    #treeBtn { left: 140px; }
    #treeType { left: 260px; }
  </style>
</head>
<body>

<button id="editBtn">건물 수정</button>
<button id="treeBtn">나무 추가 🌳</button>

<select id="treeType">
  <option value="normal">일반 나무</option>
  <option value="pine">소나무</option>
  <option value="cherry">벚나무</option>
</select>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
/* =====================
   1. 기본 세팅
===================== */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(5, 6, 8);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.DirectionalLight(0xffffff, 1).position.set(5,10,5));

/* =====================
   2. 바닥
===================== */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0xdddddd })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* =====================
   3. 건물 (빈 상가 가정)
===================== */
const buildings = [];
const suggestions = {}; // 건의 내용 저장

[-2, 0, 2].forEach((x, i) => {
  const b = new THREE.Mesh(
    new THREE.BoxGeometry(1,1,1),
    new THREE.MeshStandardMaterial({ color: 0x888888 })
  );
  b.position.set(x, 0.5, 0);
  b.userData.id = i; // 건물 ID
  scene.add(b);
  buildings.push(b);
});

/* =====================
   4. 나무 생성 (종류별)
===================== */
function addTree(x, z, type) {
  let leavesColor = 0x2e8b57;
  let height = 0.6;

  if (type === "pine") {
    leavesColor = 0x1f7a1f;
    height = 0.8;
  }
  if (type === "cherry") {
    leavesColor = 0xffb7c5;
  }

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.1, height),
    new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
  );
  trunk.position.set(x, height/2, z);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(0.4),
    new THREE.MeshStandardMaterial({ color: leavesColor })
  );
  leaves.position.set(x, height + 0.3, z);

  scene.add(trunk, leaves);
}

/* =====================
   5. 모드 관리
===================== */
let mode = "edit"; // edit | tree
editBtn.onclick = () => mode = "edit";
treeBtn.onclick = () => mode = "tree";

/* =====================
   6. 클릭 처리
===================== */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // 🌳 나무 추가
  if (mode === "tree") {
    const hit = raycaster.intersectObject(ground);
    if (hit.length) {
      const type = treeType.value;
      addTree(hit[0].point.x, hit[0].point.z, type);
    }
    return;
  }

  // 🏢 빈 상가 건의함
  const hit = raycaster.intersectObjects(buildings);
  if (!hit.length) return;

  const b = hit[0].object;
  const idea = prompt("이 빈 상가를 어떻게 활용하면 좋을까요?");

  if (idea) {
    suggestions[b.userData.id] = idea;
    console.log("건물", b.userData.id, "건의:", idea);
    alert("의견이 접수되었습니다!");
  }
});

/* =====================
   7. 렌더링
===================== */
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
